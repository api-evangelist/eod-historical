description: >-
  EOD Historical Data (EODHD) provides institutional-grade financial data through a REST API at
  https://eodhd.com/api covering 150,000+ tickers across 60+ global exchanges. The API spans
  end-of-day historical prices (30+ years), real-time OHLCV, intraday bars, fundamentals (income
  statements, balance sheets, cash flows), ETF and mutual fund data, options chains with Greeks,
  dividends, splits, corporate actions, technical indicators, financial news with sentiment, insider
  transactions, macroeconomic indicators, ESG data, and WebSocket streaming. Authentication is via
  api_token query parameter; output is JSON, CSV, or XML.
