openapi: 3.1.0
info:
  title: EODHD Financial Data Calendar Intraday Data API
  description: Comprehensive API for retrieving financial data including stock prices, fundamentals, calendar events, news, and more from EOD Historical Data (eodhd.com)
  version: 2.0.0
  contact:
    name: EODHD Support
    url: https://eodhd.com
    email: supportlevel1@eodhistoricaldata.com
  termsOfService: https://eodhd.com/financial-apis/terms-conditions
  license:
    name: Proprietary
    url: https://eodhd.com/financial-apis/terms-conditions
servers:
- url: https://eodhd.com/api
  description: Primary API path
- url: https://eodhistoricaldata.com/api
  description: Alternative API path
security:
- EODHDQueryKey: []
tags:
- name: Intraday Data
  description: Real-time and intraday price data
paths:
  /intraday/{ticker}:
    get:
      summary: Retrieve intraday historical price data
      description: Retrieve intraday historical stock data for a specific ticker.
      operationId: GetIntradayHistoricalData
      parameters:
      - name: ticker
        in: path
        required: true
        description: Ticker symbol with exchange code (e.g., 'AAPL.US').
        schema:
          type: string
      - name: api_token
        in: query
        required: true
        description: API token for authentication.
        schema:
          type: string
      - name: interval
        in: query
        required: true
        description: Interval for data points. Options are '1m' (1 minute), '5m' (5 minutes), '15m' (15 minutes), '30m' (30 minutes), and '1h' (1 hour).
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
      - name: fmt
        in: query
        required: false
        description: Response format. Defaults to CSV if not specified. Options are 'json' and 'csv'.
        schema:
          type: string
          enum:
          - json
          - csv
      - name: from
        in: query
        required: false
        description: Start datetime in Unix timestamp (UTC). For example, 1627896900 for '2021-08-02 09:35:00'.
        schema:
          type: integer
      - name: to
        in: query
        required: false
        description: End datetime in Unix timestamp (UTC). For example, 1630575300 for '2021-09-02 09:35:00'.
        schema:
          type: integer
      responses:
        '200':
          description: Successful response with intraday historical stock data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: integer
                    gmtoffset:
                      type: integer
                    datetime:
                      type: string
                      format: date-time
                    open:
                      type: number
                    high:
                      type: number
                    low:
                      type: number
                    close:
                      type: number
                    volume:
                      type:
                      - integer
                      - 'null'
              example:
              - timestamp: 1628876100
                gmtoffset: 0
                datetime: '2021-08-13 17:35:00'
                open: 148.929992
                high: 149.059997
                low: 148.929992
                close: 149.035003
                volume: 416405
              - timestamp: 1628876400
                gmtoffset: 0
                datetime: '2021-08-13 17:40:00'
                open: 149.0372
                high: 149.095001
                low: 148.940002
                close: 148.976898
                volume: 421612
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized.
        '404':
          description: No data found for the specified ticker or date range.
      tags:
      - Intraday Data
  /mp/unicornbay/tickdata/ticks:
    get:
      summary: Retrieve marketplace tick data
      description: Get tick-level data via the UnicornBay marketplace data provider. Returns granular trade-by-trade data for supported symbols.
      operationId: GetMarketplaceTickData
      parameters:
      - name: api_token
        in: query
        required: true
        description: API token for authentication.
        schema:
          type: string
      - name: s
        in: query
        required: true
        description: Ticker symbol (e.g., 'AAPL' or 'AAPL.US').
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start UNIX timestamp (UTC).
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: false
        description: End UNIX timestamp (UTC).
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of ticks to return.
        schema:
          type: integer
      - name: fmt
        in: query
        required: false
        description: Output format.
        schema:
          type: string
          enum:
          - json
          default: json
      responses:
        '200':
          description: Successfully retrieved tick data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: integer
                      format: int64
                      description: Trade timestamp in milliseconds since epoch.
                    price:
                      type: number
                      description: Trade price.
                    volume:
                      type: integer
                      description: Number of shares traded.
                    exchange:
                      type: string
                      description: Exchange code where trade occurred.
                    conditions:
                      type: string
                      description: Trade condition codes.
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized. Invalid API token.
        '404':
          description: Tick data not found.
      tags:
      - Intraday Data
  /real-time/{ticker}:
    get:
      summary: Retrieve delayed real-time stock prices
      description: Retrieve live (delayed) stock prices for specified ticker(s).
      operationId: GetLiveDelayedStockPrices
      parameters:
      - name: ticker
        in: path
        required: true
        description: Ticker symbol with exchange code (e.g., 'AAPL.US').
        schema:
          type: string
      - name: s
        in: query
        required: false
        description: Comma-separated list of additional ticker symbols for multiple requests in a single call (e.g., 'VTI,EUR.FOREX').
        schema:
          type: string
      - name: api_token
        in: query
        required: true
        description: API token for authentication.
        schema:
          type: string
      - name: ex
        in: query
        required: false
        description: Exchange code filter (e.g., 'US').
        schema:
          type: string
      - name: fmt
        in: query
        required: false
        description: Response format. Options are 'json' and 'csv'. Defaults to JSON.
        schema:
          type: string
          enum:
          - json
          - csv
      responses:
        '200':
          description: Successful response with live (delayed) stock prices.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    code:
                      type: string
                    timestamp:
                      type: integer
                    gmtoffset:
                      type: integer
                    open:
                      type: number
                    high:
                      type: number
                    low:
                      type: number
                    close:
                      type: number
                    volume:
                      type: integer
                    previousClose:
                      type: number
                    change:
                      type: number
                    change_p:
                      type: number
                - type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                      timestamp:
                        type: integer
                      gmtoffset:
                        type: integer
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type:
                        - integer
                        - 'null'
                      previousClose:
                        type: number
                      change:
                        type: number
                      change_p:
                        type: number
              examples:
                singleTicker:
                  summary: Single ticker response
                  value:
                    code: AAPL.US
                    timestamp: 1729888080
                    gmtoffset: 0
                    open: 229.74
                    high: 233.22
                    low: 229.57
                    close: 231.41
                    volume: 37931706
                    previousClose: 230.57
                    change: 0.84
                    change_p: 0.3643
                multipleTickers:
                  summary: Multiple tickers response
                  value:
                  - code: AAPL.US
                    timestamp: 1729888080
                    gmtoffset: 0
                    open: 229.74
                    high: 233.22
                    low: 229.57
                    close: 231.41
                    volume: 37931706
                    previousClose: 230.57
                    change: 0.84
                    change_p: 0.3643
                  - code: VTI.US
                    timestamp: 1729887240
                    gmtoffset: 0
                    open: 287.03
                    high: 288.25
                    low: 285.05
                    close: 285.54
                    volume: 2811137
                    previousClose: 285.81
                    change: -0.27
                    change_p: -0.0945
                  - code: EUR.FOREX
                    timestamp: 1729891800
                    gmtoffset: 0
                    open: 0.9232
                    high: 0.9263
                    low: 0.9223
                    close: 0.9257
                    volume: 0
                    previousClose: 0.9262
                    change: -0.0005
                    change_p: -0.054
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized.
        '404':
          description: Ticker not found.
      tags:
      - Intraday Data
  /ticks:
    get:
      summary: Retrieve historical tick data
      description: Get historical stock tick data for US equities using UNIX time for filtering. Limited to US exchanges.
      operationId: GetTickData
      parameters:
      - name: s
        in: query
        required: true
        description: Ticker symbol (e.g., 'AAPL' or 'AAPL.US' for US-listed stocks).
        schema:
          type: string
      - name: api_token
        in: query
        required: true
        description: API key for authentication
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start UNIX timestamp (UTC) for filtering data.
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: false
        description: End UNIX timestamp (UTC) for filtering data.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of ticks to return.
        schema:
          type: integer
      - name: fmt
        in: query
        required: false
        description: Output format (only 'json' supported)
        schema:
          type: string
          enum:
          - json
          default: json
      responses:
        '200':
          description: Successful response with tick data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ex:
                    type: array
                    items:
                      type: string
                    description: List of exchanges where transactions took place.
                  mkt:
                    type: array
                    items:
                      type: string
                    description: Market where trade took place.
                  price:
                    type: array
                    items:
                      type: number
                    description: Price of the transaction.
                  seq:
                    type: array
                    items:
                      type: integer
                    description: Trade sequence number.
                  shares:
                    type: array
                    items:
                      type: integer
                    description: Number of shares in the transaction.
                  sl:
                    type: array
                    items:
                      type: string
                    description: Sales condition codes for the trades.
                  sub_mkt:
                    type: array
                    items:
                      type: string
                    description: Sub-market where trade took place.
                  ts:
                    type: array
                    items:
                      type: integer
                      format: int64
                    description: Timestamp of each transaction in milliseconds since epoch.
              examples:
                default:
                  summary: Tick data response example
                  value:
                    ex:
                    - Q
                    - Q
                    - Q
                    mkt:
                    - K
                    - K
                    - K
                    price:
                    - 179.35
                    - 179.35
                    - 179.35
                    seq:
                    - 64234
                    - 64238
                    - 64329
                    shares:
                    - 50
                    - 10
                    - 100
                    sl:
                    - '@ TI'
                    - '@ TI'
                    - '@ T'
                    sub_mkt:
                    - ''
                    - ''
                    - ''
                    ts:
                    - 1694419200008
                    - 1694419200008
                    - 1694419200008
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized. Invalid API token.
        '404':
          description: Ticker data not found for the specified query.
      tags:
      - Intraday Data
  /us-quote-delayed:
    get:
      summary: Get US delayed stock quotes
      description: Returns 15-minute delayed quote data for US equities. Supports multiple symbols in a single request.
      operationId: GetUSQuoteDelayed
      parameters:
      - name: api_token
        in: query
        required: true
        description: Your API token for authentication.
        schema:
          type: string
      - name: s
        in: query
        required: true
        description: Comma-separated ticker symbols (e.g., 'AAPL,MSFT,GOOGL').
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: Comma-separated list of fields to return (e.g., 'close,volume,change_p').
        schema:
          type: string
      - name: fmt
        in: query
        required: false
        description: Output format.
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      responses:
        '200':
          description: Successfully retrieved delayed quote data.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: Ticker symbol.
                    timestamp:
                      type: integer
                      format: int64
                      description: UNIX timestamp of the quote.
                    gmtoffset:
                      type: integer
                      description: GMT offset in seconds.
                    open:
                      type: number
                      description: Opening price.
                    high:
                      type: number
                      description: High price.
                    low:
                      type: number
                      description: Low price.
                    close:
                      type: number
                      description: Last traded price.
                    volume:
                      type: integer
                      description: Trading volume.
                    previousClose:
                      type: number
                      description: Previous day closing price.
                    change:
                      type: number
                      description: Price change.
                    change_p:
                      type: number
                      description: Percentage price change.
        '400':
          description: Invalid request parameters.
        '401':
          description: Unauthorized. Invalid API token.
      tags:
      - Intraday Data
components:
  securitySchemes:
    EODHDQueryKey:
      type: apiKey
      in: query
      name: api_token
      description: EODHD API key (stored as a secret in ChatGPT).
