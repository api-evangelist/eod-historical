description: >-
  FinOps view of EOD Historical Data (EODHD). Flat monthly or annual subscription per API key
  tied to a plan tier (Free, EOD All World $19.99, Intraday $29.99, Fundamentals $59.99,
  All-In-One $99.99). All paid plans grant the same 100,000 calls/day and 1,000 rpm limits;
  tier choice is driven by data-type access (intraday, fundamentals, options). Annual billing
  saves approximately two months cost (~17%). Extra API call credits can be purchased separately.
  Commercial use requires a separate contract. Standard plans are personal-use licensed.
sources:
  - https://eodhd.com/pricing/
  - https://focus.finops.org/focus-specification/v1-3/
