meters:
  - name: subscription
    description: Monthly or annual subscription for an API key granting a specific data tier.
    unit: month
    aggregation: sum
    dimensions:
      - api_key
      - plan_tier
  - name: extra_credits
    description: Additional API call credits purchased beyond the plan daily quota.
    unit: credit_block
    aggregation: sum
    dimensions:
      - api_key
principles:
  - name: Visibility
    description: >-
      Tie each API key to a single owning workload or team. Monitor daily usage via /api/user endpoint.
      Collect monthly invoices into the FinOps cost store for chargeback.
  - name: Allocation
    description: >-
      Allocate subscription cost to the consuming product or business unit by API key. A single All-In-One
      key covers all data types; separate keys per team allow clear cost attribution at $19.99–$99.99/month.
  - name: Optimization
    description: >-
      Right-size the plan to the data types actually used: avoid paying for All-In-One ($99.99) when only
      EOD prices are needed ($19.99). Switch to annual billing for a ~17% saving when usage is stable.
      Monitor extraLimit to assess whether extra credits are a recurring cost needing a plan upgrade.
  - name: Accountability
    description: >-
      Assign a billing owner per API key. Review plan tier at each annual renewal against measured
      daily call volume and the data endpoints actually called. Student discount (50% for 12 months)
      can reduce costs for academic workloads.
