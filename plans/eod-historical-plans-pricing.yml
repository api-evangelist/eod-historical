        name: eod_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '19.99'
        userMultiplied: false
      - label: Annual subscription
        name: eod_annual
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: '199.00'
        userMultiplied: false
      - label: Daily quota
        name: eod_daily
        type: quota
        metric: request
        limit: 100000
        timeFrame: day
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate limit
        name: eod_rate
        type: quota
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
