specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: EOD Historical Data
providerId: eod-historical
created: '2026-06-13'
modified: '2026-06-13'
reconciled: true
tags:
  - Fintech
  - Market Data
  - Plans
description: >-
  EODHD offers a free tier (20 API calls/day, no credit card required) and four paid monthly or
  annual subscription tiers ranging from $19.99/month (EOD All World) to $99.99/month (All-In-One).
  All paid plans include 100,000 API calls/day and 1,000 requests/minute. Annual billing saves
  approximately two months cost. Commercial use requires a separate commercial solution; all standard
  plans are licensed for personal use only.
sources:
  - https://eodhd.com/pricing/
plans:
  - id: eod-historical-free
    name: Free
    type: freemium
    description: Free tier — 20 API calls per day, 1-year data depth, personal use only, no credit card required.
    entries:
      - label: Daily quota
        name: free_daily
        type: quota
        metric: request
        limit: 20
        timeFrame: day
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate limit
        name: free_rate
        type: quota
        metric: requests_per_minute
        limit: 1000
        timeFrame: minute
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Basic end-of-day stock and ETF data
      - name: 1-year historical depth
      - name: Demo API key (AAPL.US, TSLA.US, VTI.US, AMZN.US, BTC-USD.CC, EURUSD.FOREX)
  - id: eod-historical-eod-all-world
    name: EOD Historical Data — All World
    type: subscription
    description: $19.99/month (or $199/year) — 100,000 API calls/day, 30+ years EOD data, splits and dividends, adjusted prices.
    entries:
